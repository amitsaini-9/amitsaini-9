name: Refresh 3D contribution landscape

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render-contributions.py'
      - '.github/workflows/contributions-3d.yml'

permissions:
  contents: write

concurrency:
  group: contribution-landscape
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$PROFILE_OWNER" -f query='query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks { contributionDays { contributionCount date weekday } }
                }
              }
            }
          }' > "$RUNNER_TEMP/contributions.json"
      - name: Render the landscape
        run: python3 scripts/render-contributions.py "$RUNNER_TEMP/contributions.json" assets/contributions-3d.svg
      - name: Save refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions-3d.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution landscape"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
